<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Bookmarks</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.5 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: light-dark(#fafaf8, #191b1d); color: light-dark(#222, #eee); }
    #app { height: 100dvh; display: flex; flex-direction: column; }
    #app > header { flex-shrink: 0; }
    .setup-screen, .review-screen { display: flex; flex-direction: column; flex: 1; min-height: 0; border: 0; }
    .step { margin: 0 0 4px; color: light-dark(#61656b, #a6abb1); font-size: 12px; }
    header { padding: 18px 16px 12px; border-bottom: 1px solid #8884; }
    h1 { margin: 0; font-size: 18px; letter-spacing: -.4px; } h2 { font-size: 14px; margin: 0; }
    p { margin: 6px 0; } button, input { font: inherit; } button { cursor: pointer; border: 1px solid #8886; border-radius: 6px; padding: 6px 10px; background: transparent; color: inherit; }
    button:hover:not(:disabled) { background: #8882; } button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: default; } :focus-visible { outline: 2px solid #5489df; outline-offset: 2px; }
    .primary { background: #3467c3; color: white; border-color: transparent; } .danger { background: #a93030; color: white; border-color: transparent; }
    .primary:hover:not(:disabled) { background: #2854a0; } .danger:hover:not(:disabled) { background: #902626; }
    .muted, .timestamp { color: light-dark(#61656b, #a6abb1); font-size: 12px; } .timestamp { padding: 0 16px; }
    .summary, .notice { margin: 12px 16px; }
    .setup-screen > .controls, .review-screen > nav { padding: 10px 16px; flex-shrink: 0; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 0; }
    ul { list-style: none; padding-left: 18px; margin: 0; }
    .folder-tree { padding: 0 16px 12px; flex: 1; min-height: 0; overflow: auto; }
    #results { flex: 1; min-height: 0; overflow: auto; }
    .review-screen > :not(#results) { flex-shrink: 0; }
    .folder-row { display: flex; align-items: center; min-height: 32px; } .folder-row label { min-width: 0; overflow-wrap: anywhere; } .expand { padding: 2px 6px; border: 0; }
    input[type="checkbox"] { accent-color: #3467c3; width: 16px; height: 16px; vertical-align: middle; flex-shrink: 0; }
    #results > .controls, section h2 { padding: 8px 16px; } section { border-top: 1px solid #8884; } section h2 button { width: 100%; border: 0; text-align: left; }
    section h2 span { float: right; font-weight: 400; } .bookmark-row { display: flex; gap: 10px; padding: 10px 16px; border-top: 1px solid #8882; }
    .bookmark-info { min-width: 0; } a { color: light-dark(#255cac, #95bcff); overflow-wrap: anywhere; } .truncate { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .reason { font-size: 11px; color: light-dark(#925528, #d7ad7c); } footer { flex-shrink: 0; padding: 12px 16px; background: light-dark(#fafaf8, #191b1d); border-top: 1px solid #8884; }
    footer > button { width: 100%; margin-top: 10px; } .notice { border-left: 3px solid #bd873c; padding: 8px 12px; overflow-wrap: anywhere; }
    [role="status"] > p, progress { margin: 8px 16px; } progress { width: calc(100% - 32px); }
    dialog { position: fixed; inset: 0; margin: auto; width: calc(100% - 32px); max-width: 380px; padding: 20px; border: 1px solid #8886; border-radius: 10px; box-shadow: 0 0 0 100vmax #0008; z-index: 10; }
  </style>
</head>
<body><main id="app"></main><script type="module" src="./index.ts"></script></body>
</html>
