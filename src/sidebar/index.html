<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleanmarks</title>
  <style>
    :root {
      color-scheme: light;
      font: 13px/1.5 ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
      --indigo: #4947a8; --lavender: #9fa0ff; --mint: #d5e8e6; --brand-bg: #365c5d;
      --cream: #fff3e3; --coral: #ff7171; --paper: #fafaf8;
      --ink: #2e3041; --muted: #646778; --line: #e6e5ef; --bmc-yellow: #fd0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
    #app > header { flex-shrink: 0; }
    .setup-screen, .review-screen, .completion-screen { display: flex; flex-direction: column; flex: 1; min-height: 0; border: 0; }
    .step { margin: 0 0 4px; color: var(--muted); font-size: 11px; font-weight: 400; }
    header { background: var(--paper); }
    .brand-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: var(--brand-bg); color: white; }
    .stage-header { padding: 16px 18px 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; letter-spacing: -.2px; }
    .brand .app-icon { width: 28px; height: 28px; color: white; flex-shrink: 0; }
    .about-button { display: inline-flex; align-items: center; gap: 8px; padding: 5px 0 5px 8px; border: 0; font-size: 11px; flex-shrink: 0; }
    .info-symbol { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1px solid currentColor; border-radius: 50%; font: 600 12px/1 Georgia, serif; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .rescan-button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; font-size: 24px; line-height: 1; flex-shrink: 0; }
    .scan-cancel { margin: 8px 16px; }
    .scan-cancel > button { width: 100%; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.5px; } h2 { font-size: 14px; margin: 0; }
    h1[tabindex="-1"]:focus { outline: none; }
    p { margin: 6px 0; } button, input { font: inherit; } button { cursor: pointer; border: 1px solid #d2d2e3; border-radius: 8px; padding: 8px 12px; background: transparent; color: inherit; }
    button:hover:not(:disabled) { background: #9fa0ff20; } button:active:not(:disabled) { transform: scale(.98); }
    button, .folder-row, .bookmark-row, a { transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease; }
    button:disabled { opacity: .45; cursor: default; } :focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }
    .brand-bar :focus-visible { outline-color: white; }
    .primary, .danger { font-weight: 600; }
    .primary { background: var(--indigo); color: white; border-color: transparent; } .danger { background: #ad343f; color: white; border-color: transparent; }
    .primary:hover:not(:disabled) { background: #3b398e; } .danger:hover:not(:disabled) { background: #922a34; }
    .muted { color: var(--muted); font-size: 12px; }
    .summary, .notice { margin: 12px 16px; }
    .status-dead { --status-color: #a13d49; }
    .status-unreachable { --status-color: #855b21; }
    .status-moved { --status-color: #366b68; }
    .status-counts { display: flex; flex-wrap: wrap; gap: 6px; }
    .status-summary { display: inline-flex; align-items: center; gap: 5px; padding: 6px; color: var(--status-color); font-size: 11px; white-space: nowrap; }
    .status-summary strong { font-weight: 650; }
    .status-icon { width: 17px; height: 17px; flex-shrink: 0; }
    .setup-screen > .controls { padding: 10px 16px; flex-shrink: 0; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 0; }
    ul { list-style: none; padding-left: 18px; margin: 0; }
    .folder-tree { padding: 0 16px 12px; flex: 1; min-height: 0; overflow: auto; }
    #results { flex: 1; min-height: 0; overflow: auto; }
    .review-screen > :not(#results) { flex-shrink: 0; }
    .folder-row { display: flex; align-items: center; min-height: 34px; border-radius: 6px; } .folder-row label { min-width: 0; overflow-wrap: anywhere; } .expand { padding: 2px 6px; border: 0; }
    .folder-row, .bookmark-row { cursor: pointer; }
    .folder-row label { cursor: pointer; flex: 1; }
    .folder-row:hover, .bookmark-row:hover { background: #9fa0ff15; }
    .bookmark-row:has(input:checked) { background: #9fa0ff12; }
    input[type="checkbox"] { accent-color: var(--indigo); width: 16px; height: 16px; vertical-align: middle; flex-shrink: 0; }
    #results > .controls, section h2 { padding: 8px 16px; } section { border-top: 1px solid var(--line); } section h2 button { width: 100%; border: 0; text-align: left; }
    .result-section h2 { padding: 4px 8px; }
    .category-toggle { display: flex; align-items: center; gap: 8px; color: var(--status-color); }
    .category-toggle:hover:not(:disabled) { background: #2e304108; }
    .category-count { margin-left: auto; padding: 1px 6px; font-size: 12px; font-weight: 500; }
    .section-chevron { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    [aria-expanded="true"] > .section-chevron { transform: rotate(90deg); }
    .bookmark-row { display: flex; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
    .bookmark-info { min-width: 0; } a { color: var(--indigo); overflow-wrap: anywhere; } .truncate { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .reason { font-size: 11px; color: var(--status-color, #885129); } footer { flex-shrink: 0; padding: 12px 16px; background: var(--paper); border-top: 1px solid var(--line); }
    .reason summary { cursor: pointer; width: fit-content; }
    .reason p { margin: 4px 0 0; overflow-wrap: anywhere; cursor: text; }
    footer > button { width: 100%; margin-top: 8px; } footer > button:first-child { margin-top: 0; }
    .notice { border-left: 3px solid var(--coral); padding: 8px 12px; overflow-wrap: anywhere; }
    [role="status"] > p, progress { margin: 8px 16px; } progress { width: calc(100% - 32px); accent-color: var(--indigo); }
    dialog { position: fixed; inset: 0; margin: auto; width: calc(100% - 32px); max-width: 380px; padding: 20px; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 0 0 100vmax #25244366; z-index: 10; background: var(--paper); color: var(--ink); }
    .about-dialog { max-height: calc(100dvh - 32px); overflow: auto; padding: 0; border-radius: 18px; }
    .about-close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; padding: 0; border: 0; font-size: 24px; line-height: 1; color: var(--muted); }
    .about-main { padding: 30px 24px 6px; }
    .about-identity { display: flex; align-items: center; gap: 14px; padding-right: 12px; }
    .about-identity > div:last-child { min-width: 0; }
    .about-dialog h2 { padding: 0; font-size: 24px; font-weight: 650; letter-spacing: -.6px; }
    .about-app-icon { width: 60px; height: 60px; flex-shrink: 0; }
    .about-app-icon img { display: block; width: 60px; height: 60px; filter: drop-shadow(0 5px 12px #2e30412b); }
    .about-version { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .about-site { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; font-size: 12px; text-decoration: none; }
    .coffee-link.about-coffee { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 18px; padding: 11px 12px; background: var(--bmc-yellow); color: #1a1208; border: 0; border-radius: 9px; font-weight: 700; }
    .about-coffee .coffee-icon { color: #1a1208; }
    .coffee-link.about-coffee:hover:not(:disabled) { background: var(--bmc-yellow); animation: coffee-bounce .5s ease; }
    @keyframes coffee-bounce { 0%, 100% { transform: translateY(0) } 35% { transform: translateY(-3px) } 60% { transform: translateY(1px) } }
    .about-footer { margin: 0; padding: 20px 24px 18px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .about-footer a { color: inherit; text-decoration: none; } .about-footer a:hover { color: var(--indigo); }
    .about-footer .credit-license { text-decoration: underline; text-underline-offset: 3px; }
    .completion-content { flex: 1; min-height: 0; overflow: auto; text-align: center; padding: 32px 20px 24px; }
    .success-icon { position: relative; isolation: isolate; display: grid; place-items: center; width: 112px; height: 112px; margin: 0 auto 20px; }
    .success-icon .app-icon { width: 100px; height: 100px; }
    .icon-starburst { position: absolute; inset: 0; width: 112px; height: 112px; fill: var(--mint); stroke: var(--mint); stroke-width: 4px; stroke-linejoin: round; opacity: .7; z-index: -1; }
    .success-icon.partial { width: 84px; height: 84px; border-radius: 28px; background: var(--cream); color: #885129; font-size: 42px; font-weight: 650; }
    .completion-content > h1 { font-size: 30px; } .completion-summary { margin: 10px auto; max-width: 30ch; font-size: 15px; }
    .completion-note { color: var(--muted); font-size: 12px; margin: 18px 0; }
    .removed-list { text-align: left; margin: 20px 0; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .removed-list summary { cursor: pointer; color: var(--indigo); font-weight: 500; } .removed-list ul { padding: 0; }
    .removed-list li { padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; } .removed-list li:last-child { border: 0; }
    .removed-list strong, .removed-list span { display: block; } .removed-list strong { font-weight: 500; }
    .share-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 20px 0 24px; font-size: 12px; }
    .support { background: var(--cream); border-radius: 12px; padding: 14px; font-size: 12px; } .support p { margin: 0 0 8px; }
    .coffee-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; }
    .coffee-icon { flex-shrink: 0; }
    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    @media (prefers-reduced-motion: reduce) {
      button, .folder-row, .bookmark-row, a { transition: none; }
      button:active:not(:disabled) { transform: none; }
      .about-coffee:hover { animation: none; }
      .confetti { display: none; }
    }
  </style>
</head>
<body><main id="app"></main><script type="module" src="./index.ts"></script></body>
</html>
